<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地语音转文字</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <div>
        <h1>本地语音转文字</h1>
        <p class="subtitle">SenseVoice · 完全离线运行 · 支持中文 / 英文</p>
      </div>
      <div id="status" class="status status--warming">
        <span class="status__dot"></span>
        <span id="status-text">正在连接服务…</span>
      </div>
    </header>

    <main class="main">
      <section class="card">
        <div class="card-head">
          <h2>实时录音</h2>
          <span class="card-note">边说边出字 · 单次最长 60 秒</span>
        </div>

        <div id="recorder" class="recorder" data-state="idle">
          <div class="recorder__head">
            <span class="record-dot" aria-hidden="true"></span>
            <span id="record-state" class="recorder__state" role="status" aria-live="polite">
              麦克风未启用
            </span>
            <span id="record-timer" class="recorder__timer">00:00 / 01:00</span>
          </div>

          <div class="recorder__actions">
            <button id="record-start" class="record-start" type="button">
              开始录音 Start Recording
            </button>
            <button id="record-stop" class="record-stop" type="button" disabled>
              停止录音 Stop Recording
            </button>
          </div>

          <div id="live" class="live hidden">
            <div class="live__head">
              <span class="live__title">实时识别</span>
              <span id="live-state" class="live__state" role="status" aria-live="polite">
                正在连接…
              </span>
            </div>
            <p id="live-text" class="live__text" aria-live="polite">
              <span id="live-committed"></span><span id="live-partial" class="live__partial"></span>
            </p>
          </div>

          <p class="recorder__hint">
            点击开始后浏览器会请求麦克风权限；说话过程中实时显示识别文本，停止录音后给出最终结果。
            如果浏览器不支持实时识别，停止后会自动上传音频再识别。
          </p>
        </div>
      </section>

      <section class="card">
        <div id="dropzone" class="dropzone" tabindex="0" role="button"
             aria-label="拖入音频文件或点击选择">
          <input id="file-input" type="file" accept="audio/*,video/*" hidden>
          <div class="dropzone__icon" aria-hidden="true">🎧</div>
          <p class="dropzone__title">把音频文件拖到这里</p>
          <p class="dropzone__hint">或 <span class="link">点击选择文件</span></p>
          <p id="upload-limit" class="dropzone__meta">wav / mp3 / m4a / flac / mp4 等，单个文件最大 10MB</p>
        </div>

        <div id="file-info" class="file-info hidden">
          <div class="file-info__row">
            <span id="file-name" class="file-info__name"></span>
            <span id="file-size" class="file-info__size"></span>
          </div>

          <div class="player">
            <button id="play-toggle" class="player__toggle" type="button"
                    aria-label="播放音频" disabled>
              <span id="play-icon" class="player__icon" aria-hidden="true">▶</span>
              <span id="play-label">播放</span>
            </button>
            <input id="play-seek" class="player__seek" type="range"
                   min="0" max="1000" step="1" value="0"
                   aria-label="播放进度" disabled>
            <span id="play-time" class="player__time">00:00 / --:--</span>
            <audio id="audio-preview" preload="metadata"></audio>
          </div>

          <p id="play-note" class="player__note hidden" role="status"></p>
        </div>

        <div class="controls">
          <label class="field">
            <span class="field__label">语言</span>
            <select id="language">
              <option value="auto" selected>自动识别</option>
              <option value="zh">中文</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="ko">한국어</option>
              <option value="yue">粤语</option>
            </select>
          </label>

          <label class="field">
            <span class="field__label">输出格式</span>
            <select id="format">
              <option value="json" selected>文本 + 信息</option>
              <option value="txt">纯文本</option>
              <option value="srt">SRT 字幕</option>
            </select>
          </label>
        </div>

        <button id="submit" class="primary" type="button" disabled>开始识别</button>

        <div id="progress" class="progress hidden">
          <span class="spinner" aria-hidden="true"></span>
          <span id="progress-text">识别中…</span>
        </div>

        <div id="error" class="error hidden" role="alert"></div>
      </section>

      <section class="card">
        <div class="result-head">
          <h2>识别结果</h2>
          <div class="result-actions">
            <button id="copy" type="button" disabled>复制</button>
            <button id="download" type="button" disabled>下载</button>
          </div>
        </div>
        <p id="meta" class="meta hidden"></p>
        <textarea id="result" readonly spellcheck="false"
                  placeholder="识别结果会显示在这里"></textarea>
      </section>
    </main>

    <footer class="footer">
      全部推理在本机完成，音频不会离开你的电脑。
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
